user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    # Edge Rate Limiting: 100 req/min per IP (with burst support)
    limit_req_zone $binary_remote_addr zone=ori_api_limit:10m rate=100r/m;
    limit_req_status 429;

    upstream order_process_api { server order-process:3004; keepalive 16; }
    upstream wms_system_api    { server wms-system:3001; keepalive 16; }
    upstream crm_system_api    { server crm-system:3002; keepalive 16; }
    upstream tms_system_api    { server tms-system:3003; keepalive 16; }

    server {
        listen 80;
        server_name localhost _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /health {
            proxy_pass http://order_process_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/orders {
            limit_req zone=ori_api_limit burst=20 nodelay;
            proxy_pass http://order_process_api;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/pos {
            limit_req zone=ori_api_limit burst=20 nodelay;
            proxy_pass http://order_process_api;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/auth {
            proxy_pass http://order_process_api;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/monitoring {
            proxy_pass http://order_process_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/wms/ {
            limit_req zone=ori_api_limit burst=30 nodelay;
            proxy_pass http://wms_system_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/crm/ {
            proxy_pass http://crm_system_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /api/v1/tms/ {
            proxy_pass http://tms_system_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
