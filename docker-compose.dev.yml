# ==========================================================
# SE445 ORI - Local Development Infrastructure Compose
# Spins up Postgres (4 logical DBs), RabbitMQ, Kong, Nginx
# ==========================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ori_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caseuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casepass_local_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-retail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ori_pgdata_dev:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caseuser} -d ${POSTGRES_DB:-retail}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - ori_dev_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ori_rabbitmq_dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-caseuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-casepass_local_change_me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    networks:
      - ori_dev_net

  kong:
    image: kong:3.8
    container_name: ori_kong_dev
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "${KONG_PORT:-8000}:8000"
      - "8001:8001"
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 384m
    networks:
      - ori_dev_net

volumes:
  ori_pgdata_dev:
    name: ori_pgdata_dev

networks:
  ori_dev_net:
    name: ori_dev_net
